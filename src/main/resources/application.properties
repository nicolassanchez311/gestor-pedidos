# ================================================================
# ? CONFIGURACIÓN DE LA BASE DE DATOS (MariaDB)
# ================================================================
spring.datasource.url=jdbc:mariadb://localhost:3308/gestor_pedidos
spring.datasource.username=root
spring.datasource.password=admid
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ================================================================
# ? CONFIGURACIÓN DE JPA / HIBERNATE
# ================================================================
# update: actualiza la estructura de la BD según tus entidades (sin borrar datos)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto optimizado para MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ================================================================
# ? CONFIGURACIÓN DEL SERVIDOR WEB
# ================================================================
server.port=8080
spring.application.name=GestorPedidos

# ================================================================
# ? CONFIGURACIÓN DE LOGGING (opcional)
# ================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
